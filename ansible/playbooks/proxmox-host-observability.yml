---
- name: Configure Proxmox host observability
  hosts: proxmox_hosts
  become: false

  tasks:
    - name: Install Grafana repository prerequisite
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present
        update_cache: true

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Grafana APT signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure Grafana APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/grafana.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://apt.grafana.com
          Suites: stable
          Components: main
          Signed-By: /etc/apt/keyrings/grafana.asc

    - name: Install Grafana Alloy
      ansible.builtin.apt:
        name: alloy
        state: present
        update_cache: true
        install_recommends: false
      when: not ansible_check_mode

    - name: Grant Alloy journal access
      ansible.builtin.user:
        name: alloy
        groups:
          - adm
          - systemd-journal
        append: true
      notify: Restart Alloy
      when: not ansible_check_mode

    - name: Deploy Proxmox Alloy configuration
      ansible.builtin.copy:
        src: ../files/alloy/proxmox-host.alloy
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        mode: "0644"
      notify: Restart Alloy
      when: not ansible_check_mode

    - name: Enable Grafana Alloy
      ansible.builtin.service:
        name: alloy
        enabled: true
        state: started
      when: not ansible_check_mode

  handlers:
    - name: Restart Alloy
      ansible.builtin.service:
        name: alloy
        state: restarted
      when: not ansible_check_mode
