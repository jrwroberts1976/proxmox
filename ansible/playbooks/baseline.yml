---
- name: Baseline Proxmox Debian VM
  hosts: proxmox_lab
  become: true

  tasks:
    - name: Set timezone
      community.general.timezone:
        name: Europe/London

    - name: Install Grafana repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
        state: present
        update_cache: true

    - name: Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Grafana APT signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Configure Grafana APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/grafana.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://apt.grafana.com
          Suites: stable
          Components: main
          Signed-By: /etc/apt/keyrings/grafana.asc

    - name: Install baseline packages
      ansible.builtin.apt:
        name:
          - qemu-guest-agent
          - prometheus-node-exporter
        state: present
        update_cache: true
        install_recommends: false

    - name: Install Grafana Alloy
      ansible.builtin.apt:
        name: alloy
        state: present
        update_cache: true
        install_recommends: false
      when: not ansible_check_mode

    - name: Grant Alloy journal access
      ansible.builtin.user:
        name: alloy
        groups:
          - adm
          - systemd-journal
        append: true
      notify: Restart Alloy
      when: not ansible_check_mode

    - name: Deploy Alloy configuration
      ansible.builtin.copy:
        src: ../files/alloy/config.alloy
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        mode: "0644"
      notify: Restart Alloy
      when: not ansible_check_mode

    - name: Enable Grafana Alloy
      ansible.builtin.service:
        name: alloy
        enabled: true
        state: started
      when: not ansible_check_mode

    - name: Ensure QEMU guest agent is running
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
      when: not ansible_check_mode

    - name: Enable Prometheus node exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        enabled: true
        state: started
      when: not ansible_check_mode

    - name: Configure patch management baseline
      ansible.builtin.include_tasks: ../tasks/patching.yml

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: not ansible_check_mode

    - name: Restart Alloy
      ansible.builtin.service:
        name: alloy
        state: restarted
