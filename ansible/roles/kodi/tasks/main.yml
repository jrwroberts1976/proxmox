---
- name: Require Debian-family host
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: This role supports Debian-family hosts only.

- name: Require Kodi runtime user
  ansible.builtin.getent:
    database: passwd
    key: "{{ kodi_user }}"

- name: Install minimal Kodi display stack
  ansible.builtin.apt:
    name: "{{ kodi_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove conflicting generic Xorg video drivers
  ansible.builtin.apt:
    name: "{{ kodi_conflicting_xorg_packages }}"
    state: absent
    autoremove: false
  notify: Restart Kodi

- name: Configure Xorg wrapper for Kodi console service
  ansible.builtin.copy:
    dest: /etc/X11/Xwrapper.config
    owner: root
    group: root
    mode: '0644'
    content: |
      allowed_users={{ kodi_xwrapper_allowed_users }}
      needs_root_rights={{ kodi_xwrapper_needs_root_rights }}
  notify: Restart Kodi

- name: Ensure Kodi runtime user has media device access
  ansible.builtin.user:
    name: "{{ kodi_user }}"
    groups:
      - audio
      - video
      - render
      - input
    append: true

- name: Gather service state before display-manager transition
  ansible.builtin.service_facts:

- name: Record whether display manager is active
  ansible.builtin.set_fact:
    kodi_display_manager_was_active: >-
      {{ kodi_display_manager_service in ansible_facts.services and
         ansible_facts.services[kodi_display_manager_service].state == 'running' }}

- name: Stop and disable display manager for dedicated Kodi session
  ansible.builtin.systemd_service:
    name: "{{ kodi_display_manager_service }}"
    state: stopped
    enabled: false
  when: kodi_display_manager_service in ansible_facts.services

- name: Clean orphaned xinit from previous display-manager conflict
  ansible.builtin.command:
    cmd: "pkill -u {{ kodi_user }} -x xinit"
  register: kodi_orphan_xinit_cleanup
  changed_when: kodi_orphan_xinit_cleanup.rc == 0
  failed_when: kodi_orphan_xinit_cleanup.rc not in [0, 1]
  when: kodi_display_manager_was_active | bool

- name: Wait for Xwayland display owner to exit
  ansible.builtin.command:
    cmd: pgrep -x Xwayland
  register: kodi_xwayland_state
  changed_when: false
  failed_when: false
  retries: 10
  delay: 1
  until: kodi_xwayland_state.rc != 0
  when: kodi_display_manager_was_active | bool

- name: Remove stale X display lock after display-manager shutdown
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/.X0-lock
    - /tmp/.X11-unix/X0
  when: kodi_display_manager_was_active | bool

- name: Install managed Kodi systemd service
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ kodi_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Kodi Media Center
      After=systemd-user-sessions.service network-online.target sound.target
      Wants=network-online.target
      Conflicts=getty@{{ kodi_tty }}.service display-manager.service

      [Service]
      Type=simple
      User={{ kodi_user }}
      Group={{ kodi_group }}
      PAMName=login
      TTYPath=/dev/{{ kodi_tty }}
      StandardInput=tty
      StandardOutput=journal
      StandardError=journal
      Environment=HOME={{ kodi_home }}
      Environment=DISPLAY={{ kodi_display }}
      ExecStart=/usr/bin/xinit /usr/bin/kodi-standalone -- {{ kodi_display }} {{ kodi_vt }} -keeptty -nolisten tcp
      Restart=on-failure
      RestartSec={{ kodi_restart_sec }}
      KillMode=control-group
      TimeoutStopSec=20

      [Install]
      WantedBy=graphical.target
  notify: Restart Kodi

- name: Ensure Kodi service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ kodi_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Flush Kodi handlers before validation
  ansible.builtin.meta: flush_handlers

- name: Wait for Kodi service to become active
  ansible.builtin.command:
    cmd: "systemctl is-active {{ kodi_service_name }}"
  register: kodi_service_active
  changed_when: false
  failed_when: false
  retries: 12
  delay: 2
  until: kodi_service_active.stdout.strip() == 'active'

- name: Require Kodi service to be active
  ansible.builtin.assert:
    that:
      - kodi_service_active.stdout.strip() == 'active'
    fail_msg: >-
      Kodi service did not become active. Final state:
      {{ kodi_service_active.stdout | default('unknown') }}.

- name: Verify Kodi service is enabled
  ansible.builtin.command:
    cmd: "systemctl is-enabled {{ kodi_service_name }}"
  register: kodi_service_enabled
  changed_when: false
  failed_when: kodi_service_enabled.stdout.strip() != 'enabled'

- name: Verify display manager is disabled
  ansible.builtin.command:
    cmd: "systemctl is-enabled {{ kodi_display_manager_service }}"
  register: kodi_display_manager_enabled
  changed_when: false
  failed_when: kodi_display_manager_enabled.stdout.strip() not in ['disabled', 'masked']
  when: kodi_display_manager_service in ansible_facts.services

- name: Verify X display is owned by Kodi service
  ansible.builtin.shell:
    cmd: "set -o pipefail && pgrep -a Xorg | grep -F -- '{{ kodi_display }}'"
    executable: /bin/bash
  changed_when: false

- name: Verify Kodi process is running
  ansible.builtin.command:
    cmd: pgrep -a -u {{ kodi_user }} kodi.bin
  changed_when: false
