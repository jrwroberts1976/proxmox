---
- name: Assert media network variables are safe
  ansible.builtin.assert:
    that:
      - media_network_primary_interface == "eth0"
      - media_network_wifi_interface == "wlan0"
      - media_network_expected_ipv4 is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - media_network_gateway is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - media_network_managed_netplan_file.startswith('/etc/netplan/')
      - media_network_legacy_ethernet_netplan_file.startswith('/etc/netplan/')
      - media_network_legacy_wifi_netplan_file.startswith('/etc/netplan/')
    fail_msg: "media_network variables failed safety validation"

- name: Verify current Ethernet management path before changes
  ansible.builtin.shell: |
    set -euo pipefail
    ip -4 -o addr show dev {{ media_network_primary_interface | quote }} | grep -F ' {{ media_network_expected_ipv4 }}/'
    ip route show default | grep -F 'via {{ media_network_gateway }} dev {{ media_network_primary_interface }}'
  args:
    executable: /bin/bash
  changed_when: false

- name: Install canonical Ethernet-only Netplan authority
  ansible.builtin.copy:
    dest: "{{ media_network_managed_netplan_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      network:
        version: 2
        renderer: NetworkManager
        ethernets:
          {{ media_network_primary_interface }}:
            match:
              name: "{{ media_network_primary_interface }}"
            dhcp4: true
            dhcp6: true
            dhcp4-overrides:
              route-metric: 100
            dhcp6-overrides:
              route-metric: 100
  register: media_network_managed_netplan

- name: Remove installer-generated Ethernet Netplan authority
  ansible.builtin.file:
    path: "{{ media_network_legacy_ethernet_netplan_file }}"
    state: absent
  register: media_network_removed_legacy_ethernet

- name: Remove installer-generated Wi-Fi Netplan authority
  ansible.builtin.file:
    path: "{{ media_network_legacy_wifi_netplan_file }}"
    state: absent
  register: media_network_removed_legacy_wifi

- name: Validate generated Netplan configuration
  ansible.builtin.command: netplan generate
  changed_when: false

- name: Install persistent Wi-Fi disable service
  ansible.builtin.copy:
    dest: /etc/systemd/system/media-disable-wifi.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Disable Wi-Fi on managed media host
      After=NetworkManager.service
      Wants=NetworkManager.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/nmcli radio wifi off
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  register: media_network_wifi_service_unit

- name: Reload systemd when Wi-Fi service unit changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: media_network_wifi_service_unit.changed

- name: Apply Netplan asynchronously when authority changed
  ansible.builtin.shell: |
    nohup /bin/bash -c 'sleep 2; netplan apply' >/tmp/media-netplan-apply.log 2>&1 &
  args:
    executable: /bin/bash
  changed_when: true
  when: >-
    media_network_managed_netplan.changed or
    media_network_removed_legacy_ethernet.changed or
    media_network_removed_legacy_wifi.changed

- name: Wait for Ethernet SSH path after Netplan apply
  ansible.builtin.wait_for_connection:
    delay: 4
    timeout: 60
  when: >-
    media_network_managed_netplan.changed or
    media_network_removed_legacy_ethernet.changed or
    media_network_removed_legacy_wifi.changed

- name: Enable and enforce Wi-Fi disabled state
  ansible.builtin.systemd_service:
    name: media-disable-wifi.service
    enabled: true
    state: started

- name: Verify final managed network state
  ansible.builtin.shell: |
    set -euo pipefail
    ip -4 -o addr show dev {{ media_network_primary_interface | quote }} | grep -F ' {{ media_network_expected_ipv4 }}/'
    ip route show default | grep -F 'via {{ media_network_gateway }} dev {{ media_network_primary_interface }}'
    if ip -4 -o addr show dev {{ media_network_wifi_interface | quote }} | grep -q ' inet '; then
      echo "Wi-Fi still has an IPv4 address" >&2
      exit 1
    fi
    test "$(nmcli -t -f WIFI general)" = "disabled"
  args:
    executable: /bin/bash
  changed_when: false
