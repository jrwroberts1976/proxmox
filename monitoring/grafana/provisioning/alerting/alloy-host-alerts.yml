apiVersion: 1

groups:
  - orgId: 1
    name: Infrastructure - Alloy
    folder: Homelab Alerts
    interval: 1m

    rules:
      - uid: alloy-app-platform-01-telemetry-missing
        title: Alloy Telemetry Missing - app-platform-01
        condition: A

        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: |
                absent_over_time(
                  node_uname_info{
                    job="linux-hosts",
                    host="app-platform-01"
                  }[5m]
                )
              format: time_series
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A

        noDataState: OK
        execErrState: Alerting
        for: 0s

        annotations:
          summary: 'app-platform-01 Alloy telemetry missing'
          description: 'No node_uname_info metric has been received from app-platform-01 for at least 5 minutes. The VM may be down, Alloy may be stopped, or the remote-write path to ids-01 Prometheus may be unavailable.'

        labels:
          severity: critical
          category: availability
          service: alloy
          host: app-platform-01
          scope: linux-hosts
